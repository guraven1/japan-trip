<title>Japan 2026 Trip Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{--paper:#F4F5F1;--ink:#1C221F;--muted:#5C655F;--rule:#D8DCD4;--card:#FBFBF9;--card2:#EEF0EA;--accent:#2F4A8A;--moss:#3F6B4A;--moss-bg:#E3EEE5;--amber:#A8681B;--amber-bg:#F7EBD9;--nav:rgba(244,245,241,.94);--shadow:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141817;--ink:#E4E7E1;--muted:#98A19A;--rule:#2A312D;--card:#1B211E;--card2:#222926;--accent:#9AB1EA;--moss:#8CC199;--moss-bg:#213127;--amber:#E2A85E;--amber-bg:#3A2C18;--nav:rgba(20,24,23,.94);--shadow:none}}
:root[data-theme="dark"]{--paper:#141817;--ink:#E4E7E1;--muted:#98A19A;--rule:#2A312D;--card:#1B211E;--card2:#222926;--accent:#9AB1EA;--moss:#8CC199;--moss-bg:#213127;--amber:#E2A85E;--amber-bg:#3A2C18;--nav:rgba(20,24,23,.94);--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.serif{font-family:"Shippori Mincho",serif}
nav{position:sticky;top:0;z-index:5;background:var(--nav);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.tabs{display:flex;gap:2px;padding:8px 12px 0;overflow-x:auto;scrollbar-width:none}
.tabs button{white-space:nowrap;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:5px 9px;border-radius:4px}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--card);box-shadow:var(--shadow)}
.days{display:flex;gap:2px;overflow-x:auto;padding:6px 12px 8px;scrollbar-width:none}
.days button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;min-width:38px;padding:4px 5px;border-radius:5px;line-height:1.1;color:var(--ink)}
.days button b{font-family:"Shippori Mincho",serif;font-size:16px;font-weight:700}
.days button i{font-style:normal;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.days button.today{background:var(--moss-bg)}.days button.today b{color:var(--moss)}
.days button[aria-current="true"]{background:var(--card);box-shadow:var(--shadow)}
main{max-width:72ch;margin:0 auto;padding:18px 14px 90px}
h1.title{font-family:"Shippori Mincho",serif;font-weight:700;font-size:26px;line-height:1.15;margin:4px 0 2px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.status{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pill{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--card2);color:var(--muted)}
.pill.moss{background:var(--moss-bg);color:var(--moss)}.pill.amber{background:var(--amber-bg);color:var(--amber)}
/* day */
.day{margin:0 0 44px}
.dayhead{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:baseline;border-top:2px solid var(--ink);padding-top:12px}
.dayhead .date{font-family:"Shippori Mincho",serif;font-size:26px;font-weight:700;line-height:1}
.dayhead .dow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dayhead .base{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:4px}
.anchors{margin:12px 0 4px;display:grid;gap:6px}
.anchor{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:13.5px;padding:8px 10px;border-radius:6px;background:var(--card2)}
.anchor .t{font-family:"Shippori Mincho",serif;font-weight:700;font-size:15px}
.anchor .d{color:var(--muted);font-size:12.5px}
.anchor .links{font-size:12px;margin-top:2px}
.part{margin-top:16px}
.partlabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.optbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.optbtn{display:flex;align-items:center;gap:7px;text-align:left;padding:6px 10px 6px 6px;border:1px solid var(--rule);border-radius:20px;background:var(--card);font-size:13px;max-width:100%}
.optbtn .k{flex-shrink:0;font-family:"Shippori Mincho",serif;font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink);font-size:13px}
.optbtn[aria-selected="true"]{border-color:var(--moss);background:var(--moss-bg)}
.optbtn[aria-selected="true"] .k{background:var(--moss);border-color:var(--moss);color:#fff}
.bk{display:inline-block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;margin-left:4px;vertical-align:middle}
.bk.hard{background:var(--amber-bg);color:var(--amber)}.bk.light{background:var(--card2);color:var(--muted)}
.bookline{margin:8px 0 0;font-size:13px;padding:8px 10px;border-radius:6px;background:var(--card2)}
.bookline.hard{background:var(--amber-bg)}
.bookline b{font-weight:700}
.optbtn .role{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.optbtn.chosen .role::after{content:" · chosen";color:var(--moss)}
.opt{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 14px 10px;box-shadow:var(--shadow)}
.opt.chosen{border-color:var(--moss)}
.opthead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.opthead h3{margin:0;font-size:17px;font-family:"Shippori Mincho",serif;font-weight:700;line-height:1.25;text-wrap:balance}
.opthead .summary{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.choose{font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border-radius:5px;border:1px solid var(--moss);color:var(--moss);white-space:nowrap}
.choose.on{background:var(--moss);color:#fff}
.tl{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--rule)}
.tl li{border-bottom:1px solid var(--rule)}
.tl .row{display:grid;grid-template-columns:48px 1fr 18px;gap:8px;width:100%;text-align:left;padding:9px 0;align-items:start}
.tl .time{font-family:"Shippori Mincho",serif;font-weight:700;font-size:14px;padding-top:1px}
.tl .ttl{font-weight:500;font-size:14.5px}
.tl .why{color:var(--muted);font-size:12.5px;margin-top:1px}
.tl .chev{color:var(--muted);font-size:12px;padding-top:4px;transition:transform .15s}
.tl li.open .chev{transform:rotate(90deg)}
.details{display:none;padding:0 0 12px 56px;font-size:13px}
.tl li.open .details{display:block}
.details dl{margin:0;display:grid;grid-template-columns:72px 1fr;gap:3px 10px}
.details dt{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.details dd{margin:0;overflow-wrap:anywhere}
.st{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.st.verified{color:var(--moss)}.st.inferred{color:var(--amber)}
.foot{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.foot b{color:var(--ink);font-weight:500}
details.more{margin-top:10px;font-size:13.5px}
details.more summary{cursor:pointer;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 0}
details.more ul{margin:4px 0 8px;padding-left:1.1em}details.more li{margin:4px 0}
.notes{margin-top:12px}
.notes textarea{width:100%;min-height:54px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;padding:8px 10px;resize:vertical}
.notes .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--muted)}
.save{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:5px;border:1px solid var(--accent);color:var(--accent)}
.save:disabled{opacity:.4;cursor:default}
/* act now */
.act{display:grid;gap:8px}
.act label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--rule);border-radius:7px;font-size:13.5px;align-items:start;cursor:pointer}
.act input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--moss)}
.act .dl{font-size:12px;color:var(--amber);font-weight:500}
.act .dt{color:var(--muted);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.act label.done{opacity:.55}.act label.done .ttl{text-decoration:line-through}
.act label.opt .ttl::before{content:"optional · ";color:var(--muted);font-weight:400}
h2.sec{font-family:"Shippori Mincho",serif;font-size:20px;margin:26px 0 10px}
.group{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.ref{padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.ref b{font-weight:700}.ref .d{color:var(--muted);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

"https://jinya.gifu.jp/en/guide/info/"},{"time":"15:20","title":"Sanmachi sake tasting: Harada → Funasaka → Hirase","why":"Three 200-year-old breweries within 300 m, each with a paid tasting counter — Hida sake in the town that brews it; the sugidama cedar balls are brown in September (new brew is Nov–Mar), so this is tasting, not touring.","address":"Harada: 10 Kami-Sannomachi · Funasaka: 105 Kami-Sannomachi · Hirase: 82 Kami-Ichinomachi, Takayama","map":"https://www.google.com/maps/search/?api=1&query=Harada%20Sake%20Brewery%20Kami-Sannomachi%20Takayama","hours":"tasting counters 09:00–16:00 at all three (Harada shop 09:00–17:00; Funasaka shop 08:30–18:00; Hirase 08:15–17:00 weekdays)","price":"flat-fee tasting cups; official pages do not publish the fee — budget ¥400–1,000 per brewery per person (≈¥3,000–4,000 for two across three)","booking":"none","phone":"Harada 0577-32-0120 · Funasaka 0577-32-0016 · Hirase 0577-34-0010","transit":"walk 2 min from Jinya back into Sanmachi","veg":"sake is vegetarian; Funasaka's Ippukudo café does sake-lees soft-serve","status":"verified","source":"https://www.hida-nombe.jp/harada/en.html"},{"time":"16:10","title":"Takayama Matsuri Yatai Kaikan + Nikkōkan (Sakurayama Hachimangū)","why":"You miss the Oct 9–10 autumn festival by three weeks; four of its 7 m gilded floats with marionette mechanisms are displayed here year-round — this is the festival you cannot see.","address":"178 Sakuramachi, Takayama 506-0858","map":"https://www.google.com/maps/search/?api=1&query=Takayama%20Matsuri%20Yatai%20Kaikan","hours":"Wed 09:00–17:00, open daily (last entry ~16:30)","price":"¥1,000 pp (both halls)","booking":"none","phone":"0577-32-5100","transit":"walk 12 min north from Hirase along Kami-Ichinomachi / Yasukawa-dōri","veg":"","status":"verified","source":"https://www.japan-guide.com/e/e5905.html"},{"time":"17:10","title":"Miyagawa river walk → Nakabashi red bridge → hotel rooftop bath","why":"The postcard frame of Takayama is the red Nakabashi over the Miyagawa at golden hour; then 45 min in Ouan's rooftop rotenburo before dinner.","address":"Nakabashi Bridge, Kamisannomachi, Takayama","map":"https://www.google.com/maps/search/?api=1&query=Nakabashi%20Bridge%20Takayama","hours":"always open","price":"free","booking":"none","phone":"","transit":"walk 15 min back along the river to the station side","veg":"","status":"verified","source":"https://www.japan-guide.com/e/e5900.html"},{"time":"18:55","title":"LE MiDi","why":"Booked; Honmachi is 6 min on foot from Ouan.","address":"2-85 Honmachi, Takayama","map":"https://www.google.com/maps/search/?api=1&query=LE%20MiDi%20Honmachi%20Takayama","hours":"kitchen closes 20:30","price":"≈¥15,000–20,000 for two with wine","booking":"booked","phone":"0577-36-6386","transit":"walk 6 min from Ouan","veg":"ask for the non-beef course for Rachel at seating","status":"verified","source":"booking record"}],"fallback":"Rain: identical — Jinya, the breweries and the Yatai Kaikan are all indoor; carry an umbrella for the 12-min walk between them. If the Yatai Kaikan is too far after a long train day, drop it (it is also doable Sep 18 morning before the 07:40 bus is NOT realistic — so either today or never).","cost":"≈¥9,000–10,000 for two excl. LE MiDi (nigiri ¥2,000, Jinya ¥880, tastings ≈¥3,500, Yatai Kaikan ¥2,000)","book":{"need":"none","by":null,"what":"No advance booking — walk in / buy on the day"}},{"key":"B","role":"alt","character":"local & offbeat: temple ridge walk + craft shopping","title":"Center4 / Heianraku lunch → Higashiyama walking course → Sanmachi craft & vintage shops → LE MiDi","summary":"For legs that have been on trains since 09:24: a quiet 3.5 km temple-and-castle-ruin ridge above the town, then the design/kitchenware/vintage shops of the old streets.","timeline":[{"time":"13:30","title":"Lunch: Heianraku (12 seats, Chinese-Japanese, dedicated vegan menu)","why":"Rachel's best sit-down lunch in Takayama — veggie gyoza and a full vegan menu run by an English-speaking couple since 1963.","address":"6-7-2 Tenmanmachi, Takayama 506-0025","map":"https://www.google.com/maps/search/?api=1&query=Heianraku%20Tenmanmachi%20Takayama","hours":"Wed lunch 11:30–12:30 (last order), dinner 17:30–20:00 LO; closed Tue","price":"≈¥1,500–2,500 pp","booking":"reserve on heianraku.com before visiting (required, made by the diner) — the 12:30 last order means a 13:12 arrival MISSES lunch; only usable if you skip to dinner (not possible with LE MiDi) — so use Center4 Hamburgers instead today and keep Heianraku as a Sep 17 alternative","phone":"0577-32-3078","transit":"walk 7 min from Takayama Station","veg":"full vegan menu; veggie gyoza","status":"verified","source":"https://heianraku.com/"},{"time":"13:30","title":"Lunch (realistic): Center4 Hamburgers","why":"Hida-beef burgers in a retro-Americana room near Sanmachi; a cheese/veg burger option and fries for Rachel.","address":"94 Kami-Ichinomachi, Takayama 506-0844","map":"https://www.google.com/maps/search/?api=1&query=Center4%20Hamburgers%20Takayama","hours":"typically 11:00–14:30 / 18:00–21:00, irregular closures — inferred, confirm on arrival","price":"≈¥1,800–2,500 pp","booking":"none; queue","phone":"0577-36-4527","transit":"walk 12 min from the station","veg":"veggie/cheese burger — inferred","status":"inferred","source":"https://www.japan-guide.com/e/e5900.html"},{"time":"14:30","title":"Higashiyama Walking Course (Teramachi temples → Shiroyama Park castle ruins)","why":"3.5 km / 90 min through a dozen temples and the wooded castle hill with views over the roofs to the Alps — almost no tourists.","address":"Higashiyama Walking Course start near Takayama Museum of History and Art, Kami-Ichinomachi","map":"https://www.google.com/maps/search/?api=1&query=Higashiyama%20Walking%20Course%20Takayama","hours":"always open (daylight)","price":"free","booking":"none","phone":"","transit":"start 3 min from Center4","veg":"","status":"verified","source":"https://www.japan-guide.com ō World Heritage Bus Shirakawa-gō → Ainokura-guchi (arr ~10:00)","why":"No reservations possible; ¥1,300 pp cash/IC on board; sit on the right for the Shō river gorge.","address":"Shirakawa-gō Bus Terminal, Ogimachi, Shirakawa","map":"https://www.google.com/maps/search/?api=1&query=Shirakawa-go%20Bus%20Terminal","hours":"09:15 departure confirmed on the Kaetsunō page (the 12:13 Ainokura return is from the 2025 japan-guide table — confirm at the terminal board on arrival)","price":"¥1,300 pp each way","booking":"none possible","phone":"Kaetsunō 0766-21-0950","transit":"same terminal the Nohi bus arrives at","veg":"","status":"inferred","source":"https://www.japan-guide.com/bus/gokayama.html"},{"time":"10:05","title":"Ainokura village: viewpoint (10 min above the village), Folklore Museum, Gokayama washi","why":"The quieter, smaller sister village; September rice terraces gold; buy Gokayama washi here, not in Shirakawa.","address":"Ainokura, Nanto, Toyama 939-1915","map":"https://www.google.com/maps/search/?api=1&query=Ainokura%20Gassho%20Village%20Nanto","hours":"village always open; museum ~08:30–17:00","price":"village free (¥500 parking-donation box); museum ¥300","booking":"none","phone":"","transit":"walk 5 min uphill from the Ainokura-guchi stop","veg":"","status":"inferred","source":"https://www.japan-guide.com/e/e7401.html"},{"time":"11:15","title":"Early lunch: Matsuya (in the village)","why":"Sansai soba and Gokayama tofu sets inside a gasshō house — the tofu is dense enough to hold with chopsticks; menu changes seasonally.","address":"Ainokura 445, Nanto, Toyama","map":"https://www.google.com/maps/search/?api=1&query=Matsuya%20Ainokura%20Nanto","hours":"Thu 09:00–17:00","price":"≈¥1,200–2,000 pp","booking":"none","phone":"0763-66-2631","transit":"in the village","veg":"tofu / sansai soba — dashi is fish-based; ask","status":"verified","source":"https://www.gokayama-matuya.com/"},{"time":"12:13","title":"World Heritage Bus Ainokura-guchi → Shirakawa-gō (arr <script id="state" type="application/json">{"picks": {"2026-09-03/0": "A", "2026-09-04/0": "A", "2026-09-05/0": "A", "2026-09-06/0": "A", "2026-09-07/0": "A", "2026-09-08/0": "A", "2026-09-09/0": "A", "2026-09-10/0": "A", "2026-09-10/1": "A", "2026-09-11/0": "A", "2026-09-12/0": "A", "2026-09-13/0": "A", "2026-09-14/0": "A", "2026-09-14/1": "A", "2026-09-15/0": "A", "2026-09-16/0": "A", "2026-09-16/1": "A", "2026-09-17/0": "A", "2026-09-18/0": "A", "2026-09-19/0": "A", "2026-09-19/1": "A", "2026-09-20/0": "A", "2026-09-21/0": "A", "2026-09-22/0": "A", "2026-09-23/0": "A"}, "done": {}, "notes": {}, "updated": ""}</script>
<script>
(function(){
const PLAN = JSON.parse(document.getElementById('plan').textContent);
let STATE = JSON.parse(document.getElementById('state').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
let view = 'today', currentDate = null, canWrite = null, artifact = null;
const legName = id => (PLAN.meta.legs.find(l=>l.id===id)||{}).name || id;
const DOW = {Mon:'Mon',Tue:'Tue',Wed:'Wed',Thu:'Thu',Fri:'Fri',Sat:'Sat',Sun:'Sun'};

function jstToday(){ const d = new Date(Date.now() + 9*3600*1000); return d.toISOString().slice(0,10); }
function tripDay(){ const t = jstToday(); return PLAN.days.find(d=>d.date===t) ? t : null; }

$('#sub').textContent = PLAN.meta.subtitle + ' · ' + PLAN.meta.travellers.replace(/^Gur & Rachel \(/, '(');

// ---------- rendering ----------
function optionHTML(day, pi, part, opt){
  const key = day.date+'/'+pi, chosen = (STATE.picks[key]||part.recommended)===opt.key;
  const tl = (opt.timeline||[]).map((it,i)=>`<li>
    <button class="row" aria-expanded="false" data-toggle>
      <span class="time">${esc(it.time||'')}</span>
      <span><div class="ttl">${esc(it.title)}</div>${it.why?`<div class="why">${esc(it.why)}</div>`:''}</span>
      <span class="chev">▶</span></button>
    <div class="details"><dl>
      ${it.address?`<dt>Where</dt><dd>${esc(it.address)}${it.map?` · <a href="${esc(it.map)}" target="_blank" rel="noopener">map</a>`:''}</dd>`:''}
      ${it.hours?`<dt>Hours</dt><dd>${esc(it.hours)}</dd>`:''}
      ${it.price?`<dt>Price</dt><dd>${esc(it.price)}</dd>`:''}
      ${it.booking?`<dt>Booking</dt><dd>${linkify(it.booking)}</dd>`:''}
      ${it.phone?`<dt>Phone</dt><dd><a href="tel:${esc(it.phone.replace(/[^+\d]/g,''))}">${esc(it.phone)}</a></dd>`:''}
      ${it.transit?`<dt>Getting there</dt><dd>${esc(it.transit)}</dd>`:''}
      ${it.veg?`<dt>Veg</dt><dd>${esc(it.veg)}</dd>`:''}
      <dt>Checked</dt><dd><span class="st ${esc(it.status||'inferred')}">${esc(it.status||'inferred')}</span>${it.source?` · <a href="${esc(it.source)}" target="_blank" rel="noopener">source</a>`:''}</dd>
    </dl></div></li>`).join('');
  return `<div class="opt ${chosen?'chosen':''}" data-opt="${esc(opt.key)}">
    <div class="opthead"><div><h3>${esc(opt.key)} · ${esc(opt.title)}</h3><p class="summary">${esc(opt.summary||'')}</p></div>
      <button class="choose ${chosen?'on':''}" data-choose="${esc(key)}" data-key="${esc(opt.key)}">${chosen?'Chosen':'Choose this'}</button></div>
    ${bookLine(opt)}
    <ul class="tl">${tl}</ul>
    <div class="foot">${opt.cost?`<span><b>Cost</b> ${esc(opt.cost)}</span>`:''}${opt.fallback?`<span><b>If weather turns</b> ${esc(opt.fallback)}</span>`:''}</div>
  </div>`;
}
function partHTML(day, pi, part){
  const key = day.date+'/'+pi, sel = STATE.picks[key]||part.recommended;
  const shown = part.options.find(o=>o.key===sel) || part.options[0];
  const bar = part.options.map(o=>`<button class="optbtn ${o.key===sel?'chosen':''}" role="tab" aria-selected="${o.key===shown.key}" data-show="${esc(key)}" data-key="${esc(o.key)}"><span class="k">${esc(o.key)}</span><span><div>${esc(o.title)}</div><div class="role">${esc(o.role)}${o.key===part.recommended?' · recommended':''}${bkChip(o)}</div></span></button>`).join('');
  return `<div class="part" data-part="${esc(key)}">${part.label?`<div class="partlabel">${esc(part.label)}</div>`:''}<div class="optbar" role="tablist">${bar}</div><div class="optwrap">${optionHTML(day,pi,part,shown)}</div></div>`;
}
function dayHTML(day){
  const anchors = (day.anchors||[]).map(a=>`<div class="anchor"><div class="t">${esc(a.time||'—')}</div><div><div>${esc(a.title)}</div>${a.detail?`<div class="d">${esc(a.detail)}</div>`:''}<div class="links">${a.map?`<a href="${esc(a.map)}" target="_blank" rel="noopener">map</a>`:''}${a.phone?` · <a href="tel:${esc(a.phone.replace(/[^+\d]/g,''))}">${esc(a.phone)}</a>`:''}</div></div></div>`).join('');
  const parts = day.parts.map((p,i)=>partHTML(day,i,p)).join('');
  const meals = (day.meals||[]).map(m=>`<li><b>${esc(m.slot)}</b> — ${esc(m.name)}${m.why?`: ${esc(m.why)}`:''}${m.price?` · ${esc(m.price)}`:''}${m.booking?` · ${linkify(m.booking)}`:''}${m.phone?` · <a href="tel:${esc(m.phone.replace(/[^+\d]/g,''))}">${esc(m.phone)}</a>`:''}${m.veg?` · <i>veg:</i> ${esc(m.veg)}`:''}</li>`).join('');
  const notes = (day.notes||[]).map(n=>`<li>${esc(n)}</li>`).join('');
  const dn = STATE.notes[day.date]||'';
  return `<section class="day" id="d${day.date.slice(-2)}" data-date="${day.date}">
    <div class="dayhead"><div class="date">${esc(day.date.slice(-2).replace(/^0/,''))} <span class="dow">${esc(day.dow)} · Sep</span></div><div class="pill">${esc(day.legs.map(legName).join(' → '))}</div><div class="base">${esc(day.base)}</div></div>
    ${anchors?`<div class="anchors">${anchors}</div>`:''}
    ${parts}
    ${meals?`<details class="more"><summary>Meal ideas for open slots</summary><ul>${meals}</ul></details>`:''}
    ${notes?`<details class="more"><summary>Gotchas for this day</summary><ul>${notes}</ul></details>`:''}
    <div class="notes"><textarea data-notes="${day.date}" placeholder="Your notes for this day (confirmations, changes, things to remember)…">${esc(dn)}</textarea><div class="row"><span>Notes are saved to the page for both of you.</span><button class="save" data-save="${day.date}" disabled>Save notes</button></div></div>
  </section>`;
}
const fmtD = d => d ? new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '';
function bkChip(o){ const b=o.book||{}; if(b.need==='hard') return `<span class="bk hard">book by ${esc(fmtD(b.by))}</span>`; if(b.need==='light') return `<span class="bk light">booking optional</span>`; return ''; }
function bookLine(o){ const b=o.book||{}; if(b.need==='hard') return `<p class="bookline hard"><b>Needs booking by ${esc(fmtD(b.by))}:</b> ${esc(b.what)}</p>`; if(b.need==='light') return `<p class="bookline"><b>Light booking (by ${esc(fmtD(b.by))}, or walk in):</b> ${esc(b.what)}</p>`; return `<p class="bookline">No advance booking — decide on the day.</p>`; }
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }

function renderDays(list){ app.innerHTML = list.map(dayHTML).join(''); }
function renderAct(){
  const items = PLAN.act_now.map((a,i)=>{const done=!!STATE.done['a'+i]; const opt=/^\(optional\)/i.test(a.title);
    return `<label class="${done?'done':''} ${opt?'opt':''}"><input type="checkbox" data-done="a${i}" ${done?'checked':''}><span><div class="ttl">${esc(a.title.replace(/^\(optional\)\s*/i,''))}</div>${a.deadline?`<div class="dl">${esc(a.deadline)}</div>`:''}${a.detail?`<div class="dt">${linkify(a.detail)}</div>`:''}${a.link?`<div class="dt"><a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.link)}</a></div>`:''}<div class="dt"><span class="pill">${esc(legName(a.leg))}</span></div></span></label>`;}).join('');
  const dl = [];
  PLAN.days.forEach(d=>d.parts.forEach((p,pi)=>p.options.forEach(o=>{ if(o.book && o.book.need!=='none' && o.book.by) dl.push({by:o.book.by, need:o.book.need, date:d.date, dow:d.dow, key:o.key, title:o.title, what:o.book.what, label:p.label, def:o.role==='default'}); })));
  dl.sort((a,b)=>a.by.localeCompare(b.by)||a.date.localeCompare(b.date));
  const dlHtml = dl.map(x=>`<div class="ref"><b>${esc(fmtD(x.by))}</b> <span class="bk ${x.need}">${x.need==='hard'?'needed':'optional'}</span> — <b>${esc(x.dow)} ${esc(fmtD(x.date))} · option ${esc(x.key)}</b>${x.def?' (current default)':''}${x.label?` · ${esc(x.label)}`:''}<div class="d">${esc(x.title)}<br>${esc(x.what)}</div></div>`).join('');
  app.innerHTML = `<h2 class="sec">Must do</h2><p class="sub">The short list that isn't optional. Tick when done — it saves for both of you. Times are Japan time.</p><div class="act">${items}</div>
  <h2 class="sec">Only if you choose that option</h2><p class="sub">Nothing here is committed. Each line is the last sensible day to book an option if you want to keep it open — decide on the go, and let the rest lapse. "Optional" means walk-in or same-day booking usually works.</p>${dlHtml}`;
}
function renderRef(){
  const groups = {};
  PLAN.bookings.forEach(b=>{(groups[b.group]=groups[b.group]||[]).push(`<div class="ref"><b>${esc(b.title)}</b><div class="d">${linkify(b.detail)}</div></div>`)});
  let html = '<h2 class="sec">Bookings & confirmations</h2>';
  for (const g in groups) html += `<div class="group">${esc(g)}</div>${groups[g].join('')}`;
  html += '<h2 class="sec">Places & numbers by leg</h2>';
  PLAN.meta.legs.forEach(l=>{ const rs = PLAN.reference.filter(r=>r.leg===l.id); if(!rs.length) return;
    html += `<div class="group">${esc(l.name)}</div>` + rs.map(r=>`<div class="ref"><b>${esc(r.title)}</b><div class="d">${linkify(r.detail)}${r.map?` · <a href="${esc(r.map)}" target="_blank" rel="noopener">map</a>`:''}${r.phone?` · <a href="tel:${esc(r.phone.replace(/[^+\d]/g,''))}">${esc(r.phone)}</a>`:''}</div></div>`).join(''); });
  app.innerHTML = html;
}
function renderNav(){
  $('#daynav').innerHTML = PLAN.days.map(d=>`<button data-date="${d.date}" class="${d.date===jstToday()?'today':''}" aria-current="${d.date===currentDate}"><b>${esc(d.date.slice(-2).replace(/^0/,''))}</b><i>${esc(d.dow)}</i></button>`).join('');
}
function render(){
  document.querySelectorAll('.tabs [role=tab]').forEach(b=>b.setAttribute('aria-selected', b.dataset.view===view));
  if (view==='today'){ const t = tripDay() || currentDate || PLAN.days[0].date; currentDate = t; renderDays([PLAN.days.find(d=>d.date===t)]); }
  else if (view==='days'){ renderDays(PLAN.days); }
  else if (view==='act') renderAct(); else renderRef();
  renderNav(); renderStatus(); $('#daynav').hidden = (view==='act'||view==='ref');
}
function renderStatus(){
  const s = $('#status');
  const mode = canWrite===null ? '<span class="pill">connecting…</span>' : canWrite ? '<span class="pill moss">you can edit</span>' : '<span class="pill amber">view only</span>';
  s.innerHTML = mode + (STATE.updated?`<span>last saved ${esc(STATE.updated)}</span>`:'') + `<span>${PLAN.days.length} days · ${PLAN.days.reduce((n,d)=>n+d.parts.reduce((m,p)=>m+p.options.length,0),0)} options · generated ${esc(PLAN.meta.generated)}</span>`;
}

// ---------- events ----------
document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) return;
  if (t.dataset.view){ view = t.dataset.view; render(); window.scrollTo(0,0); return; }
  if (t.dataset.date && t.closest('#daynav')){ currentDate = t.dataset.date; if(view!=='days'){ view='today'; render(); } const el = document.getElementById('d'+t.dataset.date.slice(-2)); if(el) el.scrollIntoView({block:'start'}); renderNav(); return; }
  if (t.hasAttribute('data-toggle')){ const li = t.closest('li'); li.classList.toggle('open'); t.setAttribute('aria-expanded', li.classList.contains('open')); return; }
  if (t.dataset.show){ const part = t.closest('.part'); const [date,pi] = t.dataset.show.split('/'); const day = PLAN.days.find(d=>d.date===date); const p = day.parts[+pi]; const opt = p.options.find(o=>o.key===t.dataset.key); part.querySelector('.optwrap').innerHTML = optionHTML(day,+pi,p,opt); part.querySelectorAll('.optbtn').forEach(b=>b.setAttribute('aria-selected', b.dataset.key===opt.key)); return; }
  if (t.dataset.choose){ STATE.picks[t.dataset.choose] = t.dataset.key; persist('Choice saved'); const part = t.closest('.part'); const [date,pi] = t.dataset.choose.split('/'); const day = PLAN.days.find(d=>d.date===date); part.outerHTML = partHTML(day,+pi,day.parts[+pi]); return; }
  if (t.dataset.save){ STATE.notes[t.dataset.save] = document.querySelector(`[data-notes="${t.dataset.save}"]`).value; t.disabled = true; persist('Notes saved'); return; }
});
document.addEventListener('input', e=>{ const ta = e.target.closest('[data-notes]'); if(ta){ const b = document.querySelector(`[data-save="${ta.dataset.notes}"]`); if(b) b.disabled = false; } });
document.addEventListener('change', e=>{ const c = e.target.closest('[data-done]'); if(c){ STATE.done[c.dataset.done] = c.checked; c.closest('label').classList.toggle('done', c.checked); persist(c.checked?'Marked done':'Unmarked'); } });

// ---------- persistence via the artifact capability ----------
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),1800); }
function buildDocument(){
  STATE.updated = new Date(Date.now()+9*3600*1000).toISOString().slice(0,16).replace('T',' ') + ' JST';
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#app').innerHTML = '';
  clone.querySelector('#daynav').innerHTML = '';
  clone.querySelector('#status').innerHTML = '';
  clone.querySelector('#toast').className = 'toast';
  clone.querySelector('#state').textContent = JSON.stringify(STATE).replace(/<\//g,'<\\/');
  return '<!doctype html>\n' + clone.outerHTML;
}
let pending = null;
function persist(msg){
  try { localStorage.setItem('japan-trip-state', JSON.stringify(STATE)); } catch(e){}
  if (!artifact){ toast(canWrite===false ? 'View only — not saved for others' : 'Saved on this device'); renderStatus(); return; }
  clearTimeout(pending);
  pending = setTimeout(async ()=>{
    try { await artifact.publish(buildDocument()); toast(msg); }
    catch(err){ if (err && (err.code==='not_writer'||err.code==='not_granted')){ canWrite=false; toast('View only — not saved for others'); } else if (err && err.code==='conflict'){ toast('Someone else saved first — reloading'); } else { toast('Could not save'); } }
    renderStatus();
  }, 600);
}
(async ()=>{
